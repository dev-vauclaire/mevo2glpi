[project]
name = "glpi-ticketing-transcribe-ai-simulator"
version = "0.1.0"
description = "Simulateur Transcribe AI reserve au staging"
license = "EUPL-1.2"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1",
    "pydantic-settings>=2.10,<3",
    "uvicorn>=0.35,<1",
]

[project.scripts]
glpi-ticketing-transcribe-ai-simulator = "glpi_ticketing_transcribe_ai_simulator.application:main"
glpi-ticketing-transcribe-ai-simulator-smoke = "glpi_ticketing_transcribe_ai_simulator.smoke:main"

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"
