[project]
name = "glpi-ticketing-openai-transcription-simulator"
version = "0.1.0"
description = "Simulateur de transcription synchrone compatible OpenAI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1",
    "pydantic-settings>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.35,<1",
]

[project.scripts]
glpi-ticketing-openai-transcription-simulator = "glpi_ticketing_openai_transcription_simulator.application:main"

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"
