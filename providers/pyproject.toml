[project]
name = "glpi-ticketing-provider-simulators-workspace"
version = "0.1.0"
description = "Workspace autonome des fournisseurs synthétiques de staging"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "simulators/microsoft-graph-simulator",
    "simulators/transcribe-ai-simulator",
]

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
minversion = "8.4"
addopts = "--strict-config --strict-markers --import-mode=importlib"
testpaths = ["simulators"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = [
    "simulators/microsoft-graph-simulator/src",
    "simulators/transcribe-ai-simulator/src",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
