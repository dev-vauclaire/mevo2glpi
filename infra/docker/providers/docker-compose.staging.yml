name: ${COMPOSE_PROJECT_NAME:-mevo2glpi-staging-simulators}

services:
  microsoft-graph-simulator:
    extends:
      file: ../components/simulator-services.yml
      service: microsoft-graph-simulator
    image: ${COMPOSE_PROJECT_NAME:-mevo2glpi-staging-simulators}-microsoft-graph-simulator:0.1.0
    environment:
      MICROSOFT_GRAPH_SIMULATOR_HOST: 0.0.0.0
      MICROSOFT_GRAPH_SIMULATOR_PORT: "8080"
      MICROSOFT_GRAPH_SIMULATOR_MAILBOX_ID: ${MICROSOFT_GRAPH_SIMULATOR_MAILBOX_ID:?Set MICROSOFT_GRAPH_SIMULATOR_MAILBOX_ID}
      MICROSOFT_GRAPH_SIMULATOR_ADMIN_TOKEN: ${MICROSOFT_GRAPH_SIMULATOR_ADMIN_TOKEN:?Set MICROSOFT_GRAPH_SIMULATOR_ADMIN_TOKEN}
    volumes:
      - type: bind
        source: ${MICROSOFT_GRAPH_SIMULATOR_AUDIO_FIXTURES_HOST_PATH:?Set MICROSOFT_GRAPH_SIMULATOR_AUDIO_FIXTURES_HOST_PATH}
        target: /fixtures/audio
        read_only: true
        bind:
          create_host_path: false
    expose:
      - "8080"
    networks:
      simulators:
        aliases:
          - mevo2glpi-staging-microsoft-graph

  openai-transcription-simulator:
    extends:
      file: ../components/simulator-services.yml
      service: openai-transcription-simulator
    image: ${COMPOSE_PROJECT_NAME:-mevo2glpi-staging-simulators}-openai-transcription-simulator:0.1.0
    environment:
      OPENAI_TRANSCRIPTION_SIMULATOR_HOST: 0.0.0.0
      OPENAI_TRANSCRIPTION_SIMULATOR_PORT: "8080"
      OPENAI_TRANSCRIPTION_SIMULATOR_API_KEY: ${OPENAI_TRANSCRIPTION_SIMULATOR_API_KEY:?Set OPENAI_TRANSCRIPTION_SIMULATOR_API_KEY}
      OPENAI_TRANSCRIPTION_SIMULATOR_MAX_UPLOAD_BYTES: ${OPENAI_TRANSCRIPTION_SIMULATOR_MAX_UPLOAD_BYTES:-26214400}
    expose:
      - "8080"
    networks:
      simulators:
        aliases:
          - mevo2glpi-staging-openai-transcription

networks:
  simulators:
    name: ${SIMULATORS_NETWORK_NAME:-mevo2glpi-staging-simulators-network}
    external: true
