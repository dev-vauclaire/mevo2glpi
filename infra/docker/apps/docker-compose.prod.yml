name: ${COMPOSE_PROJECT_NAME:-mevo2glpi-prod}

# Les services sont déclarés directement pour rester visibles dans Dokploy.
# `extends` fusionne chaque définition avec le socle commun sans créer les
# collisions de ressources interdites par la sémantique Compose de `include`.
services:
  database-migrations:
    extends:
      file: ./docker-compose.common.services.yml
      service: database-migrations

  web:
    extends:
      file: ./docker-compose.common.services.yml
      service: web

  worker-automation:
    extends:
      file: ./docker-compose.common.services.yml
      service: worker-automation
    environment:
      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-openai_compatible}
      LEGACY_TRANSCRIPTION_BASE_URL: ${LEGACY_TRANSCRIPTION_BASE_URL:-}
      LEGACY_TRANSCRIPTION_API_KEY: ${LEGACY_TRANSCRIPTION_API_KEY:-}
      OPENAI_COMPATIBLE_TRANSCRIPTION_BASE_URL: ${OPENAI_COMPATIBLE_TRANSCRIPTION_BASE_URL:-http://mevo2glpi-prod-transcription:5092/v1}
      OPENAI_COMPATIBLE_TRANSCRIPTION_API_KEY: ${OPENAI_COMPATIBLE_TRANSCRIPTION_API_KEY:-}
      OPENAI_COMPATIBLE_TRANSCRIPTION_MODEL: ${OPENAI_COMPATIBLE_TRANSCRIPTION_MODEL:-parakeet-ultra}
      OPENAI_COMPATIBLE_TRANSCRIPTION_LANGUAGE: ${OPENAI_COMPATIBLE_TRANSCRIPTION_LANGUAGE:-fr}
      GLPI_BASE_URL: ${GLPI_BASE_URL:?Set GLPI_BASE_URL}
      GLPI_USERNAME: ${GLPI_USERNAME:?Set GLPI_USERNAME}
      GLPI_PASSWORD: ${GLPI_PASSWORD:?Set GLPI_PASSWORD}
      GLPI_CLIENT_ID: ${GLPI_CLIENT_ID:?Set GLPI_CLIENT_ID}
      GLPI_CLIENT_SECRET: ${GLPI_CLIENT_SECRET:?Set GLPI_CLIENT_SECRET}
      GLPI_HTTP_TIMEOUT_SECONDS: ${GLPI_HTTP_TIMEOUT_SECONDS:-10}
      SSL_CERT_FILE: /etc/ssl/certs/mevo2glpi-ca-bundle.pem
    networks:
      - database
      - transcription

  worker-publisher:
    extends:
      file: ./docker-compose.common.services.yml
      service: worker-publisher
    environment:
      PUBLISHER_GRAPH_AUTH_MODE: entra_certificate
      PUBLISHER_GRAPH_BASE_URL: https://graph.microsoft.com/v1.0
      PUBLISHER_ENTRA_TENANT_ID: ${PUBLISHER_ENTRA_TENANT_ID:?Set PUBLISHER_ENTRA_TENANT_ID}
      PUBLISHER_ENTRA_CLIENT_ID: ${PUBLISHER_ENTRA_CLIENT_ID:?Set PUBLISHER_ENTRA_CLIENT_ID}
      PUBLISHER_ENTRA_PRIVATE_KEY_PEM_PATH: /run/secrets/publisher-entra-private-key.pem
      PUBLISHER_ENTRA_CERTIFICATE_PEM_PATH: /run/secrets/publisher-entra-certificate.pem
      PUBLISHER_ENTRA_PRIVATE_KEY_PASSPHRASE: ${PUBLISHER_ENTRA_PRIVATE_KEY_PASSPHRASE:-}
    volumes:
      - type: bind
        source: ${PUBLISHER_ENTRA_PRIVATE_KEY_PEM_HOST_PATH:?Set PUBLISHER_ENTRA_PRIVATE_KEY_PEM_HOST_PATH}
        target: /run/secrets/publisher-entra-private-key.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PUBLISHER_ENTRA_CERTIFICATE_PEM_HOST_PATH:?Set PUBLISHER_ENTRA_CERTIFICATE_PEM_HOST_PATH}
        target: /run/secrets/publisher-entra-certificate.pem
        read_only: true
        bind:
          create_host_path: false

  worker-retention:
    extends:
      file: ./docker-compose.common.services.yml
      service: worker-retention
    environment:
      GLPI_BASE_URL: ${GLPI_BASE_URL:?Set GLPI_BASE_URL}
      GLPI_USERNAME: ${GLPI_USERNAME:?Set GLPI_USERNAME}
      GLPI_PASSWORD: ${GLPI_PASSWORD:?Set GLPI_PASSWORD}
      GLPI_CLIENT_ID: ${GLPI_CLIENT_ID:?Set GLPI_CLIENT_ID}
      GLPI_CLIENT_SECRET: ${GLPI_CLIENT_SECRET:?Set GLPI_CLIENT_SECRET}
      GLPI_HTTP_TIMEOUT_SECONDS: ${GLPI_HTTP_TIMEOUT_SECONDS:-10}
      SSL_CERT_FILE: /etc/ssl/certs/mevo2glpi-ca-bundle.pem

networks:
  database:
    name: ${DATABASE_NETWORK_NAME:-mevo2glpi-prod-database-network}
    external: true
  dokploy-network:
    name: ${DOKPLOY_NETWORK_NAME:-dokploy-network}
    external: true
  transcription:
    name: ${TRANSCRIPTION_NETWORK_NAME:-mevo2glpi-prod-transcription-network}
    external: true

volumes:
  audio-data:
    name: ${AUDIO_VOLUME_NAME:-mevo2glpi-prod-audio-data}
