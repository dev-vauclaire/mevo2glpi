name: ${COMPOSE_PROJECT_NAME:-mevo2glpi-staging}

# Les cinq applications héritent du socle commun. Les simulateurs et le moteur
# de transcription sont déployés dans deux projets Dokploy indépendants.
services:
  database-migrations:
    extends:
      file: ./docker-compose.common.services.yml
      service: database-migrations

  web:
    extends:
      file: ./docker-compose.common.services.yml
      service: web

  worker-automation:
    extends:
      file: ./docker-compose.common.services.yml
      service: worker-automation
    environment:
      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-openai_compatible}
      OPENAI_COMPATIBLE_TRANSCRIPTION_BASE_URL: ${OPENAI_COMPATIBLE_TRANSCRIPTION_BASE_URL:-http://mevo2glpi-staging-transcription:5092/v1}
      OPENAI_COMPATIBLE_TRANSCRIPTION_API_KEY: ${TRANSCRIPTION_API_KEY:?Set TRANSCRIPTION_API_KEY}
      OPENAI_COMPATIBLE_TRANSCRIPTION_MODEL: parakeet-ultra
      OPENAI_COMPATIBLE_TRANSCRIPTION_LANGUAGE: fr
      GLPI_BASE_URL: ${GLPI_BASE_URL:?Set GLPI_BASE_URL to the external staging GLPI URL}
      GLPI_USERNAME: ${GLPI_USERNAME:?Set GLPI_USERNAME}
      GLPI_PASSWORD: ${GLPI_PASSWORD:?Set GLPI_PASSWORD}
      GLPI_CLIENT_ID: ${GLPI_CLIENT_ID:?Set GLPI_CLIENT_ID}
      GLPI_CLIENT_SECRET: ${GLPI_CLIENT_SECRET:?Set GLPI_CLIENT_SECRET}
      GLPI_HTTP_TIMEOUT_SECONDS: ${GLPI_HTTP_TIMEOUT_SECONDS:-10}
      SSL_CERT_FILE: /etc/ssl/certs/mevo2glpi-ca-bundle.pem
    networks:
      - transcription

  worker-publisher:
    extends:
      file: ./docker-compose.common.services.yml
      service: worker-publisher
    environment:
      PUBLISHER_GRAPH_AUTH_MODE: synthetic
      PUBLISHER_GRAPH_BASE_URL: ${PUBLISHER_GRAPH_BASE_URL:-http://mevo2glpi-staging-microsoft-graph:8080/v1.0}
    networks:
      - simulators

  worker-retention:
    extends:
      file: ./docker-compose.common.services.yml
      service: worker-retention
    environment:
      GLPI_BASE_URL: ${GLPI_BASE_URL:?Set GLPI_BASE_URL to the external staging GLPI URL}
      GLPI_USERNAME: ${GLPI_USERNAME:?Set GLPI_USERNAME}
      GLPI_PASSWORD: ${GLPI_PASSWORD:?Set GLPI_PASSWORD}
      GLPI_CLIENT_ID: ${GLPI_CLIENT_ID:?Set GLPI_CLIENT_ID}
      GLPI_CLIENT_SECRET: ${GLPI_CLIENT_SECRET:?Set GLPI_CLIENT_SECRET}
      GLPI_HTTP_TIMEOUT_SECONDS: ${GLPI_HTTP_TIMEOUT_SECONDS:-10}
      SSL_CERT_FILE: /etc/ssl/certs/mevo2glpi-ca-bundle.pem

networks:
  database:
    name: ${DATABASE_NETWORK_NAME:-mevo2glpi-staging-database-network}
    external: true
  dokploy-network:
    name: ${DOKPLOY_NETWORK_NAME:-dokploy-network}
    external: true
  simulators:
    name: ${SIMULATORS_NETWORK_NAME:-mevo2glpi-staging-simulators-network}
    external: true
  transcription:
    name: ${TRANSCRIPTION_NETWORK_NAME:-mevo2glpi-staging-transcription-network}
    external: true

volumes:
  audio-data:
    name: ${AUDIO_VOLUME_NAME:-mevo2glpi-staging-audio-data}
