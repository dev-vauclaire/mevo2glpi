name: ${COMPOSE_PROJECT_NAME:-gta-staging}

# Les cinq applications héritent du socle commun. Les simulateurs sont
# déployés séparément et partagent uniquement le réseau providers externe.
services:
  database-migrations:
    extends:
      file: ./docker-compose.common.services.yml
      service: database-migrations

  web:
    extends:
      file: ./docker-compose.common.services.yml
      service: web

  worker-automation:
    extends:
      file: ./docker-compose.common.services.yml
      service: worker-automation
    environment:
      LEGACY_TRANSCRIPTION_BASE_URL: http://gta-staging-transcribe-ai:8080
      LEGACY_TRANSCRIPTION_API_KEY: ${TRANSCRIBE_AI_SIMULATOR_API_KEY:?Set TRANSCRIBE_AI_SIMULATOR_API_KEY}
      GLPI_BASE_URL: ${GLPI_BASE_URL:?Set GLPI_BASE_URL to the external staging GLPI URL}
      GLPI_USERNAME: ${GLPI_USERNAME:?Set GLPI_USERNAME}
      GLPI_PASSWORD: ${GLPI_PASSWORD:?Set GLPI_PASSWORD}
      GLPI_CLIENT_ID: ${GLPI_CLIENT_ID:?Set GLPI_CLIENT_ID}
      GLPI_CLIENT_SECRET: ${GLPI_CLIENT_SECRET:?Set GLPI_CLIENT_SECRET}
      GLPI_HTTP_TIMEOUT_SECONDS: ${GLPI_HTTP_TIMEOUT_SECONDS:-10}
      SSL_CERT_FILE: /etc/ssl/certs/gta-ca-bundle.pem
    networks:
      - providers

  worker-publisher:
    extends:
      file: ./docker-compose.common.services.yml
      service: worker-publisher
    environment:
      PUBLISHER_GRAPH_AUTH_MODE: synthetic
      PUBLISHER_GRAPH_BASE_URL: http://gta-staging-microsoft-graph:8080/v1.0
    networks:
      - providers

  worker-retention:
    extends:
      file: ./docker-compose.common.services.yml
      service: worker-retention
    environment:
      GLPI_BASE_URL: ${GLPI_BASE_URL:?Set GLPI_BASE_URL to the external staging GLPI URL}
      GLPI_USERNAME: ${GLPI_USERNAME:?Set GLPI_USERNAME}
      GLPI_PASSWORD: ${GLPI_PASSWORD:?Set GLPI_PASSWORD}
      GLPI_CLIENT_ID: ${GLPI_CLIENT_ID:?Set GLPI_CLIENT_ID}
      GLPI_CLIENT_SECRET: ${GLPI_CLIENT_SECRET:?Set GLPI_CLIENT_SECRET}
      GLPI_HTTP_TIMEOUT_SECONDS: ${GLPI_HTTP_TIMEOUT_SECONDS:-10}
      SSL_CERT_FILE: /etc/ssl/certs/gta-ca-bundle.pem

networks:
  database:
    name: ${DATABASE_NETWORK_NAME:-gta-staging-database-network}
    external: true
  dokploy-network:
    name: ${DOKPLOY_NETWORK_NAME:-dokploy-network}
    external: true
  providers:
    name: ${PROVIDERS_NETWORK_NAME:-gta-staging-providers-network}
    external: true

volumes:
  audio-data:
    name: ${AUDIO_VOLUME_NAME:-gta-staging-audio-data}
