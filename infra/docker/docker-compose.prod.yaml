name: ${COMPOSE_PROJECT_NAME:-glpi-ticketing-automation}

x-runtime-hardening: &runtime-hardening
  init: true
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 128
  stop_grace_period: 30s
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  nginx:
    <<: *runtime-hardening
    image: ${GTA_NGINX_IMAGE:-glpi-ticketing-nginx}:${GTA_IMAGE_TAG:-0.1.0-poc}
    build:
      context: ./nginx
      dockerfile: Dockerfile
      args:
        IMAGE_VERSION: ${GTA_IMAGE_TAG:-0.1.0-poc}
        VCS_REF: ${GTA_VCS_REF:-unknown}
    depends_on:
      web:
        condition: service_healthy
    group_add:
      - "${GTA_NGINX_SECRET_GID:?GTA_NGINX_SECRET_GID must be set}"
    ports:
      - target: 8443
        published: "${GTA_NGINX_HTTPS_PORT:-443}"
        host_ip: "${GTA_NGINX_BIND_IP:-127.0.0.1}"
        protocol: tcp
    secrets:
      - nginx_tls_certificate
      - nginx_tls_key
      - nginx_htpasswd
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=101,gid=101,mode=0700
    networks:
      - proxy-edge
      - web-private
    restart: unless-stopped

  web:
    <<: *runtime-hardening
    image: ${GTA_WEB_IMAGE:-glpi-ticketing-web}:${GTA_IMAGE_TAG:-0.1.0-poc}
    build:
      context: ../..
      dockerfile: infra/docker/web/Dockerfile
      args:
        IMAGE_VERSION: ${GTA_IMAGE_TAG:-0.1.0-poc}
        VCS_REF: ${GTA_VCS_REF:-unknown}
    env_file:
      - path: ${GTA_WEB_ENV_FILE:-./web/web.env}
        required: true
    environment:
      AUDIO_PENDING_DIR: /data/audio-pending
      AUDIO_COMPLETED_DIR: /data/audio-completed
      WEB_HOST: 0.0.0.0
      WEB_PORT: "8000"
      # Safe only because web-private contains no untrusted service.
      WEB_TRUST_PROXY_HEADERS: "true"
    expose:
      - "8000"
    volumes:
      - type: bind
        source: "${GTA_DATA_ROOT:?GTA_DATA_ROOT must be set}/pending"
        target: /data/audio-pending
        bind:
          create_host_path: false
      - type: bind
        source: "${GTA_DATA_ROOT:?GTA_DATA_ROOT must be set}/completed"
        target: /data/audio-completed
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=${GTA_WEB_TMPFS_SIZE:-128m},mode=1777
    networks:
      - web-private
    restart: unless-stopped

  worker:
    <<: *runtime-hardening
    image: ${GTA_WORKER_IMAGE:-glpi-ticketing-worker}:${GTA_IMAGE_TAG:-0.1.0-poc}
    build:
      context: ../..
      dockerfile: infra/docker/worker/Dockerfile
      args:
        IMAGE_VERSION: ${GTA_IMAGE_TAG:-0.1.0-poc}
        VCS_REF: ${GTA_VCS_REF:-unknown}
    env_file:
      - path: ${GTA_WORKER_ENV_FILE:-./worker/worker.env}
        required: true
    environment:
      AUDIO_PENDING_DIR: /data/audio-pending
      AUDIO_PROCESSING_DIR: /data/audio-processing
      AUDIO_COMPLETED_DIR: /data/audio-completed
      AUDIO_FAILED_DIR: /data/audio-failed
    volumes:
      - type: bind
        source: "${GTA_DATA_ROOT:?GTA_DATA_ROOT must be set}/pending"
        target: /data/audio-pending
        bind:
          create_host_path: false
      - type: bind
        source: "${GTA_DATA_ROOT:?GTA_DATA_ROOT must be set}/processing"
        target: /data/audio-processing
        bind:
          create_host_path: false
      - type: bind
        source: "${GTA_DATA_ROOT:?GTA_DATA_ROOT must be set}/completed"
        target: /data/audio-completed
        bind:
          create_host_path: false
      - type: bind
        source: "${GTA_DATA_ROOT:?GTA_DATA_ROOT must be set}/failed"
        target: /data/audio-failed
        bind:
          create_host_path: false
    networks:
      - worker-egress
    # Exit code 3 means "blocked": an operator must inspect before restarting.
    restart: "no"

networks:
  proxy-edge:
  web-private:
    internal: true
  worker-egress:

secrets:
  nginx_tls_certificate:
    file: ${GTA_NGINX_TLS_CERTIFICATE_FILE:?GTA_NGINX_TLS_CERTIFICATE_FILE must be set}
  nginx_tls_key:
    file: ${GTA_NGINX_TLS_KEY_FILE:?GTA_NGINX_TLS_KEY_FILE must be set}
  nginx_htpasswd:
    file: ${GTA_NGINX_HTPASSWD_FILE:?GTA_NGINX_HTPASSWD_FILE must be set}
