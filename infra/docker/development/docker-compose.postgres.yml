name: gta-development-postgres

# Ces identifiants sont fictifs et strictement réservés au développement local.
# Ils ne doivent jamais être réutilisés dans un autre environnement.
services:
  postgres:
    image: postgres:18.6-alpine3.24@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    command:
      - postgres
      - -c
      - timezone=UTC
    environment:
      POSTGRES_DB: glpi_ticketing_dev
      POSTGRES_USER: gta_dev
      POSTGRES_PASSWORD: gta_dev_only
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --host=127.0.0.1 --username=$$POSTGRES_USER --dbname=$$POSTGRES_DB
      interval: 1s
      timeout: 5s
      retries: 60
      start_period: 2s
    ports:
      - target: 5432
        published: "${GTA_DEV_POSTGRES_PORT:-5432}"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - postgres-data:/var/lib/postgresql
    shm_size: 128m
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  postgres-data:
    name: gta-development-postgres18-data
