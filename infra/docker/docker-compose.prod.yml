name: ${COMPOSE_PROJECT_NAME:-gta-prod}

# Dokploy crée ce fichier à côté du point d'entrée Compose. L'include explicite
# contourne la régression v0.30.3 lorsque --project-directory désigne la racine
# du dépôt au lieu du répertoire contenant ce fichier.
include:
  - path: ./infra/docker/docker-compose.prod.services.yml
    project_directory: ./infra/docker
    env_file: ${GTA_DOKPLOY_ENV_FILE:-./infra/docker/.env}
