x-release-guard:
  # The tracked versions file initially contains zero digests because no registry
  # artefact exists yet. Compose refuses the environment until an operator has
  # replaced every sentinel and explicitly confirmed the immutable release.
  confirmed: ${GTA_RELEASE_DIGESTS_CONFIRMED:?replace zero digests before staging}

services:
  database-migrations:
    pull_policy: missing
  web:
    pull_policy: missing
  worker-automation:
    pull_policy: missing
  worker-retention:
    pull_policy: missing
  nginx:
    pull_policy: missing
    labels:
      org.glpi-ticketing-automation.environment: staging
      org.glpi-ticketing-automation.release-confirmed: ${GTA_RELEASE_DIGESTS_CONFIRMED:?replace zero digests before staging}
