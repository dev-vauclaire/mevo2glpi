[project]
name = "glpi-ticketing-database"
version = "0.1.0"
description = "Modèles et configuration SQLAlchemy partagés du cycle de vie des jobs"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
]

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"
