services:
  db:
    image: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    environment:
      MYSQL_DATABASE: ${GLPI_DB_NAME:?GLPI_DB_NAME is required}
      MYSQL_USER: ${GLPI_DB_USER:?GLPI_DB_USER is required}
      MYSQL_PASSWORD: ${GLPI_DB_PASSWORD:?GLPI_DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${GLPI_DB_ROOT_PASSWORD:?GLPI_DB_ROOT_PASSWORD is required}
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping --host=127.0.0.1 --user=root --silent
      interval: 2s
      timeout: 5s
      retries: 90
      start_period: 10s
    networks:
      - glpi_test
    volumes:
      - mysql_data:/var/lib/mysql

  glpi:
    image: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is required}-glpi-test:11.0.7
    build:
      context: image
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      GLPI_CRONTAB_ENABLED: "0"
      GLPI_DB_HOST: ${GLPI_DB_HOST:?GLPI_DB_HOST is required}
      GLPI_DB_PORT: ${GLPI_DB_PORT:?GLPI_DB_PORT is required}
      GLPI_DB_NAME: ${GLPI_DB_NAME:?GLPI_DB_NAME is required}
      GLPI_DB_USER: ${GLPI_DB_USER:?GLPI_DB_USER is required}
      GLPI_DB_PASSWORD: ${GLPI_DB_PASSWORD:?GLPI_DB_PASSWORD is required}
      GLPI_TEST_USERNAME: ${GLPI_TEST_USERNAME:?GLPI_TEST_USERNAME is required}
      GLPI_TEST_PASSWORD: ${GLPI_TEST_PASSWORD:?GLPI_TEST_PASSWORD is required}
      GLPI_TEST_OAUTH_CLIENT_NAME: ${GLPI_TEST_OAUTH_CLIENT_NAME:?GLPI_TEST_OAUTH_CLIENT_NAME is required}
      GLPI_TEST_REQUEST_SOURCE_NAME: ${GLPI_TEST_REQUEST_SOURCE_NAME:?GLPI_TEST_REQUEST_SOURCE_NAME is required}
    ports:
      - target: 80
        published: 0
        host_ip: 127.0.0.1
        protocol: tcp
    networks:
      - glpi_test
    volumes:
      - glpi_data:/var/glpi

networks:
  glpi_test:
    driver: bridge

volumes:
  mysql_data:
  glpi_data:
