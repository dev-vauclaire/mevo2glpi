name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  UV_NO_PROGRESS: "1"

jobs:
  validate:
    name: Qualité, tests et migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.14"
          check-latest: false

      - name: Installer uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.10.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: true

      - name: Synchroniser le workspace verrouillé
        run: uv sync --locked --all-packages --all-groups

      - name: Vérifier le formatage
        run: uv run ruff format --check .

      - name: Exécuter l'analyse statique
        run: uv run ruff check .

      - name: Exécuter la suite locale déterministe
        run: >-
          uv run --all-packages pytest
          -m "not database and not deployment and not glpi and not transcribe_ai and not e2e"
          --maxfail=1

      - name: Valider le manifeste Docker Compose de production
        run: >-
          docker compose
          --env-file ./infra/docker/.env.example
          --file infra/docker/docker-compose.prod.yml
          config --quiet

      - name: Valider le manifeste Docker Compose de staging
        run: >-
          docker compose
          --env-file ./infra/docker/staging.env.example
          --file infra/docker/docker-compose.staging.yml
          config --quiet

      - name: Valider PostgreSQL et les migrations
        run: >-
          uv run --all-packages pytest
          -m database
          -vv
          --maxfail=1
