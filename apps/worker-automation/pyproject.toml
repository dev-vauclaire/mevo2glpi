[project]
name = "mevo2glpi-worker-automation"
version = "0.1.0"
description = "Application worker d'automatisation des tickets GLPI"
license = "EUPL-1.2"
requires-python = ">=3.12"
dependencies = [
    "mevo2glpi-common>=0.1,<0.2",
    "mevo2glpi-database>=0.1,<0.2",
    "mevo2glpi-glpi>=0.1,<0.2",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy>=2.0,<3",
]

[project.scripts]
mevo2glpi-worker-automation = "mevo2glpi_worker_automation.application:main"

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"
