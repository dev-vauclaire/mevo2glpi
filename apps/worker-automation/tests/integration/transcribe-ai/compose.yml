x-application-environment: &application-environment
  DATABASE_URL: postgresql://${DB_USER:?DB_USER is required}:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/${DB_NAME:?DB_NAME is required}
  SECRET_KEY: ${API_SECRET_KEY:?API_SECRET_KEY is required}
  REDIS_URL: redis://redis:6379/0
  AUDIO_STORAGE_PATH: /var/lib/transcribe-ai/audio

services:
  postgres:
    image: postgres:16.10-alpine@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --host=127.0.0.1 --username=$$POSTGRES_USER --dbname=$$POSTGRES_DB
      interval: 2s
      timeout: 5s
      retries: 90
      start_period: 5s
    networks:
      - transcribe_ai_test
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.4.5-alpine@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 5s
      retries: 90
      start_period: 2s
    networks:
      - transcribe_ai_test

  api:
    image: devauclaire/transcribe-ai-api:1.0.0@sha256:6b6d09523c133e0c134d81b87a089928df4ead835716cf31641b2111f1106157
    platform: linux/amd64
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *application-environment
      API_PORT: "5000"
      FORMAT_AUDIO_ALLOWED: "wav,mp3,ogg,m4a"
      MAX_AUDIO_SIZE_MB: "10"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket; socket.create_connection(('127.0.0.1', 5000), timeout=2).close()
      interval: 2s
      timeout: 5s
      retries: 90
      start_period: 5s
    ports:
      - target: 5000
        published: 0
        host_ip: 127.0.0.1
        protocol: tcp
    networks:
      - transcribe_ai_test
    volumes:
      - audio_data:/var/lib/transcribe-ai/audio

  mono-voice-stt:
    image: devauclaire/transcribe-ai-mono-voice-stt:1.0.0@sha256:ef2ebf883bf2b6fa597559396ebb31fd345ec5bcec499f8e828e866f8103f44b
    platform: linux/amd64
    environment:
      ASR_MODEL_PATH: /models
      ASR_MODEL_NAME: tiny
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/busy', timeout=2).read()
      interval: 2s
      timeout: 5s
      retries: 300
      start_period: 10s
    networks:
      - transcribe_ai_test
    volumes:
      - whisper_models:/models

  mono-voice-worker:
    image: devauclaire/transcribe-ai-mono-voice-worker:1.0.0@sha256:3b7a3b3292d58aa544c9b5ffb65c14dfaaa95f5bc1bd9777e20bea975f500f59
    platform: linux/amd64
    depends_on:
      api:
        condition: service_healthy
      mono-voice-stt:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *application-environment
      PYTHONUNBUFFERED: "1"
      WHISPER_SERVICE_URL: http://mono-voice-stt:5001
    networks:
      - transcribe_ai_test
    volumes:
      - audio_data:/var/lib/transcribe-ai/audio

networks:
  transcribe_ai_test:
    driver: bridge

volumes:
  postgres_data:
  audio_data:
  whisper_models:
