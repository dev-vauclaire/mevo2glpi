[project]
name = "glpi-ticketing-worker-publisher"
version = "0.1.0"
description = "Application d'ingestion des messages vocaux Microsoft 365"
license = "EUPL-1.2"
requires-python = ">=3.12"
dependencies = [
    "glpi-ticketing-common>=0.1,<0.2",
    "glpi-ticketing-database>=0.1,<0.2",
    "httpx2>=2,<3",
    "msal>=1.35,<2",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy>=2.0,<3",
]

[project.scripts]
glpi-ticketing-publisher = "glpi_ticketing_worker_publisher.application:main"
glpi-ticketing-publisher-replay = "glpi_ticketing_worker_publisher.replay.application:main"

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[tool.uv.sources]
glpi-ticketing-common = { workspace = true }
glpi-ticketing-database = { workspace = true }
