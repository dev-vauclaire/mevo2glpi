[project]
name = "mevo2glpi-database-migrations"
version = "0.1.0"
description = "Application one-shot de migration de la base du cycle de vie"
license = "EUPL-1.2"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "mevo2glpi-common>=0.1,<0.2",
    "mevo2glpi-database>=0.1,<0.2",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy>=2.0,<3",
]

[project.scripts]
mevo2glpi-database-migrations = "mevo2glpi_database_migrations.application:main"

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"
