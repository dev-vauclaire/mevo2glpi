<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Déposer un audio</title>
    <link rel="stylesheet" href="{{ request.url_for('static', path='/css/app.css') }}">
    <script defer src="{{ request.url_for('static', path='/js/upload.js') }}"></script>
  </head>
  <body>
    <main>
      <h1>Déposer un audio</h1>
      <form
        action="{{ upload_path }}"
        method="post"
        enctype="multipart/form-data"
      >
        <label for="audio-file">Fichier audio</label>
        <input
          id="audio-file"
          name="audio_file"
          type="file"
          accept=".wav,.mp3,.ogg,.m4a"
          data-audio-input
          required
        >
        <p class="hint" data-selected-file aria-live="polite"></p>
        <button type="submit">Envoyer</button>
      </form>
      <p class="hint">Taille maximale : {{ max_upload_bytes }} octets.</p>
    </main>
  </body>
</html>
