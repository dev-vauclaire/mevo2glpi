[project]
name = "mevo2glpi-workspace"
version = "0.1.0"
description = "Workspace mevo2glpi pour transformer les messages vocaux en tickets GLPI"
readme = "README.md"
license = "EUPL-1.2"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "apps/database-migrations",
    "apps/transcription-api",
    "apps/web",
    "apps/worker-automation",
    "apps/worker-publisher",
    "apps/worker-retention",
    "packages/common",
    "packages/database",
    "packages/glpi-client",
    "providers/simulators/microsoft-graph-simulator",
    "providers/simulators/openai-transcription-simulator",
    "providers/simulators/transcribe-ai-simulator",
]

[tool.uv.sources]
mevo2glpi-common = { workspace = true }
mevo2glpi-database = { workspace = true }
mevo2glpi-glpi = { workspace = true }

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "httpx2>=2,<3",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
    "pytest-timeout>=2.4,<3",
    "respx>=0.22,<1",
    "ruff>=0.12,<1",
    "testcontainers>=4.12,<5",
]

[tool.pytest.ini_options]
minversion = "8.4"
addopts = "--strict-config --strict-markers --import-mode=importlib"
testpaths = ["apps", "packages", "providers", "tests"]
pythonpath = ["."]
markers = [
    "database: démarre une instance PostgreSQL jetable pour valider le schéma et les migrations",
    "deployment: valide le Compose Dokploy et les images runtime du MVP",
    "glpi: démarre une instance GLPI jetable avec Testcontainers",
    "transcription_model: exécute une validation CPU avec le modèle de transcription réel",
    "transcribe_ai: démarre une stack Transcribe AI jetable avec Testcontainers",
    "e2e: assemble la stack MVP complète avec GLPI et Transcribe AI jetables",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = [
    "apps/database-migrations/src",
    "apps/transcription-api/src",
    "apps/web/src",
    "apps/worker-automation/src",
    "apps/worker-publisher/src",
    "apps/worker-retention/src",
    "packages/common/src",
    "packages/database/src",
    "packages/glpi-client/src",
    "providers/simulators/microsoft-graph-simulator/src",
    "providers/simulators/openai-transcription-simulator/src",
    "providers/simulators/transcribe-ai-simulator/src",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
