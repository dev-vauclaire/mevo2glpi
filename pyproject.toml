[project]
name = "glpi-ticketing-automation-workspace"
version = "0.1.0"
description = "Workspace du POC d'automatisation de tickets GLPI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "apps/database-migrations",
    "apps/web",
    "apps/worker-automation",
    "packages/common",
    "packages/database",
    "packages/glpi-client",
]

[tool.uv.sources]
glpi-ticketing-common = { workspace = true }
glpi-ticketing-database = { workspace = true }
glpi-ticketing-glpi = { workspace = true }

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "httpx2>=2,<3",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
    "pytest-timeout>=2.4,<3",
    "respx>=0.22,<1",
    "ruff>=0.12,<1",
    "testcontainers>=4.12,<5",
]

[tool.pytest.ini_options]
minversion = "8.4"
addopts = "--strict-config --strict-markers --import-mode=importlib"
testpaths = ["apps", "packages", "tests"]
pythonpath = ["."]
markers = [
    "database: démarre une instance PostgreSQL jetable pour valider le schéma et les migrations",
    "deployment: construit et démarre les images runtime et le reverse proxy Docker du POC",
    "glpi: démarre une instance GLPI jetable avec Testcontainers",
    "transcribe_ai: démarre une stack Transcribe AI jetable avec Testcontainers",
    "e2e: exécute le flux complet avec services externes",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = [
    "apps/database-migrations/src",
    "apps/web/src",
    "apps/worker-automation/src",
    "packages/common/src",
    "packages/database/src",
    "packages/glpi-client/src",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
