[project]
name = "glpi-ticketing-automation"
version = "0.1.0"
description = "POC d'automatisation de tickets GLPI à partir de fichiers audio"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "jinja2>=3.1,<4",
    "pydantic-settings>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.35,<1",
]

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
    "pytest-timeout>=2.4,<3",
    "respx>=0.22,<1",
    "ruff>=0.12,<1",
    "testcontainers>=4.12,<5",
]

[tool.pytest.ini_options]
minversion = "8.4"
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = [
    "glpi: démarre une instance GLPI jetable avec Testcontainers",
    "live_transcribe: appelle le serveur Transcribe AI local",
    "e2e: exécute le flux complet avec services externes",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
