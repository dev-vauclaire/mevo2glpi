services:
  worker-automation:
    networks:
      glpi-e2e:
      transcribe-ai-e2e:

  worker-retention:
    networks:
      glpi-e2e:

networks:
  glpi-e2e:
    external: true
    name: ${GTA_E2E_GLPI_NETWORK:?GTA_E2E_GLPI_NETWORK must be set}
  transcribe-ai-e2e:
    external: true
    name: ${GTA_E2E_TRANSCRIBE_AI_NETWORK:?GTA_E2E_TRANSCRIBE_AI_NETWORK must be set}
